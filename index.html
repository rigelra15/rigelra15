<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigel's GitHub activity in 3D</title>
<meta name="description" content="Every day of the last year of Rigel Ramadhani Waloni's GitHub contributions as a block you can rotate and hover.">
<style>
  :root {
    --bg: #F5F5F5; --panel: #FFFFFF; --dots: #CFCFCF; --edge: #D9D9D9;
    --ink: #1E1E1E; --muted: #555555; --accent: #0B6FC2; --focus: #0B6FC2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --panel: #1E1E1E; --dots: #343434; --edge: #383838;
      --ink: #FFFFFF; --muted: #B3B3B3; --accent: #0D99FF; --focus: #0D99FF;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 24px 16px 40px; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1080px; margin: 0 auto; }
  .card {
    position: relative; border: 1px solid var(--edge); border-radius: 16px; overflow: hidden;
    background-color: var(--panel);
    background-image: radial-gradient(var(--dots) 1.1px, transparent 1.2px);
    background-size: 24px 24px;
  }
  header { padding: 24px 28px 0; }
  h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; font-size: 18px; color: var(--muted); }
  .stage { position: relative; margin-top: 4px; }
  canvas {
    display: block; width: 100%; height: clamp(340px, 58vw, 620px);
    cursor: grab; touch-action: none; border-radius: 0 0 16px 16px;
  }
  canvas.dragging { cursor: grabbing; }
  canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  #tip {
    position: absolute; pointer-events: none; z-index: 2; max-width: 240px;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 600;
    background: var(--ink); color: var(--panel); transform: translate(-50%, calc(-100% - 14px));
    opacity: 0; transition: opacity .12s;
  }
  #tip.on { opacity: 1; }
  #tip small { display: block; font-weight: 400; opacity: .85; }
  #state {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    font-size: 18px; color: var(--muted);
  }
  #state[hidden] { display: none; }
  #state a { color: var(--accent); }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
    padding: 14px 28px 20px; border-top: 1px solid var(--edge);
    background: color-mix(in srgb, var(--panel) 92%, transparent);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; min-width: 44px; padding: 0 16px;
    color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .hint { margin: 16px 4px 0; font-size: 15px; color: var(--muted); }
  .hint a { color: var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <h1 id="total">&nbsp;</h1>
      <p id="sub">&nbsp;</p>
    </header>
    <div class="stage">
      <canvas id="c" tabindex="0" role="img" aria-label="3D block chart of GitHub contributions over the last year. Arrow keys rotate, plus and minus zoom."></canvas>
      <div id="tip" role="presentation"></div>
      <div id="state">Loading contributions…</div>
    </div>
    <div class="bar">
      <div class="controls">
        <button id="left" type="button" aria-label="Rotate left">&larr;</button>
        <button id="right" type="button" aria-label="Rotate right">&rarr;</button>
        <button id="zin" type="button" aria-label="Zoom in">+</button>
        <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
        <button id="spin" type="button" aria-pressed="false">Spin</button>
        <button id="reset" type="button">Reset view</button>
      </div>
      <div class="legend" aria-hidden="true">Less <span id="lg"></span> More</div>
    </div>
  </div>
  <p class="hint">Drag to rotate, hover or tap a block to see its day. Keyboard: arrow keys rotate, plus and minus zoom, Home resets. <a href="https://github.com/rigelra15">Back to the profile</a></p>
  <div class="sr" id="live" aria-live="polite"></div>
</main>
<script>
(() => {
  const PALETTE = {
    dark:  { levels: ["#2C2C2C", "#0B4A7A", "#0A78C4", "#0D99FF", "#8AD2FF"], ink: "#FFFFFF" },
    light: { levels: ["#E2E2E2", "#BDE0FA", "#79C2F4", "#0D99FF", "#0B6FC2"], ink: "#1E1E1E" },
  };
  const DEFAULT = { yaw: 0.62, pitch: 0.62, zoom: 1.15 };
  const view = { ...DEFAULT };
  const $ = (id) => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d"), tip = $("tip");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const fmt = new Intl.DateTimeFormat("en", { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

  let boxes = [], weeks = 0, peak = 1, W = 0, H = 0, dpr = 1, dirty = true, hover = -1, pinned = -1;
  let drag = null, spinning = false, hits = [];

  const level = (c) => !c ? 0 : (r => r <= .12 ? 1 : r <= .3 ? 2 : r <= .6 ? 3 : 4)(c / peak);
  const shade = (hex, f) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${(n >> 16 & 255) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`;
  };

  function build(data) {
    peak = Math.max(1, ...data.days.map((d) => d.c));
    weeks = Math.max(...data.days.map((d) => d.i)) + 1;
    boxes = data.days.map((d) => ({
      date: d.d, count: d.c, x: d.i - (weeks - 1) / 2, z: d.j - 3,
      h: d.c ? 0.35 + 4.2 * Math.sqrt(d.c / peak) : 0.06,
    }));
    const active = data.days.filter((d) => d.c).length;
    $("total").textContent = data.total.toLocaleString("en");
    $("sub").textContent = `contributions in the last year, ${active} active days`;
    canvas.setAttribute("aria-label",
      `3D block chart: ${data.total} GitHub contributions over the last year on ${active} active days, busiest day ${peak}. Arrow keys rotate, plus and minus zoom.`);
    $("state").hidden = true;
    const pal = PALETTE[dark.matches ? "dark" : "light"].levels;
    $("lg").innerHTML = pal.map((c) => `<i style="background:${c}"></i>`).join("");
    dirty = true;
  }

  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    dirty = true;
  }

  function project(x, y, z, k, cs, sn, sp, cp) {
    const xr = x * cs + z * sn, zr = -x * sn + z * cs;
    return [W / 2 + xr * k, H * 0.56 + (zr * sp - y * cp) * k, zr];
  }

  function draw() {
    dirty = false;
    const pal = PALETTE[dark.matches ? "dark" : "light"];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!boxes.length) return;
    const cs = Math.cos(view.yaw), sn = Math.sin(view.yaw), sp = Math.sin(view.pitch), cp = Math.cos(view.pitch);
    const k = (W * 0.46 / (weeks / 2 + 3)) * view.zoom;
    const order = boxes.map((b, i) => [i, -b.x * sn + b.z * cs]).sort((a, b) => a[1] - b[1]);
    hits = [];
    const o = 0.4;
    for (const [i] of order) {
      const b = boxes[i], base = pal.levels[level(b.count)];
      const P = (dx, dy, dz) => project(b.x + dx, dy, b.z + dz, k, cs, sn, sp, cp);
      const bot = [P(-o, 0, -o), P(o, 0, -o), P(o, 0, o), P(-o, 0, o)];
      const top = [P(-o, b.h, -o), P(o, b.h, -o), P(o, b.h, o), P(-o, b.h, o)];
      // side faces as [outward normal x, z, corner a, corner b]
      const sides = [[1, 0, 1, 2], [-1, 0, 3, 0], [0, 1, 2, 3], [0, -1, 0, 1]];
      const polys = [];
      for (const [nx, nz, a, c] of sides) {
        if (-nx * sn + nz * cs <= 0.001) continue; // faces away from the viewer
        const lit = nx * cs + nz * sn;
        polys.push([[bot[a], bot[c], top[c], top[a]], shade(base, 0.66 - 0.12 * lit)]);
      }
      polys.push([top, base]);
      const isHot = i === hover || i === pinned;
      for (const [pts, col] of polys) {
        ctx.beginPath();
        pts.forEach((p, n) => (n ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
        ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
        if (isHot) { ctx.lineWidth = 2; ctx.strokeStyle = pal.ink; ctx.stroke(); }
        hits.push([i, pts]);
      }
    }
    hits.reverse(); // nearest first for hit testing
  }

  function inside(p, pts) {
    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  const pick = (x, y) => { for (const [i, pts] of hits) if (inside([x, y], pts)) return i; return -1; };

  function show(i, x, y) {
    if (i < 0) { tip.classList.remove("on"); return; }
    const b = boxes[i];
    const label = b.count ? `${b.count} contribution${b.count > 1 ? "s" : ""}` : "No contributions";
    tip.innerHTML = `${label}<small>${fmt.format(new Date(b.date + "T00:00:00Z"))}</small>`;
    tip.style.left = Math.min(Math.max(x, 110), W - 110) + "px";
    tip.style.top = Math.max(y, 70) + "px";
    tip.classList.add("on");
    $("live").textContent = `${label}, ${fmt.format(new Date(b.date + "T00:00:00Z"))}`;
  }

  const local = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const rot = (dy, dp) => { view.yaw += dy; view.pitch = Math.min(1.35, Math.max(0.15, view.pitch + dp)); dirty = true; };
  const zoom = (f) => { view.zoom = Math.min(4, Math.max(0.6, view.zoom * f)); dirty = true; };

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, moved: 0 };
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", (e) => {
    const [x, y] = local(e);
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      if (drag.moved > 4) { rot(dx * 0.008, dy * 0.006); pinned = -1; show(-1); }
      return;
    }
    const i = pick(x, y);
    if (i !== hover) { hover = i; dirty = true; }
    show(i, x, y);
  });
  canvas.addEventListener("pointerup", (e) => {
    const wasTap = drag && drag.moved <= 4;
    drag = null; canvas.classList.remove("dragging");
    if (wasTap) { const [x, y] = local(e); pinned = pick(x, y); hover = pinned; show(pinned, x, y); dirty = true; }
  });
  canvas.addEventListener("pointercancel", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("pointerleave", () => { if (!drag) { hover = -1; if (pinned < 0) show(-1); dirty = true; } });
  canvas.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(Math.exp(-e.deltaY * 0.01)); } }, { passive: false });
  canvas.addEventListener("keydown", (e) => {
    const map = { ArrowLeft: () => rot(-0.12, 0), ArrowRight: () => rot(0.12, 0), ArrowUp: () => rot(0, 0.08), ArrowDown: () => rot(0, -0.08),
      "+": () => zoom(1.15), "=": () => zoom(1.15), "-": () => zoom(1 / 1.15), Home: () => Object.assign(view, DEFAULT) };
    if (map[e.key]) { e.preventDefault(); map[e.key](); dirty = true; }
  });

  $("left").onclick = () => rot(-0.2, 0);
  $("right").onclick = () => rot(0.2, 0);
  $("zin").onclick = () => zoom(1.2);
  $("zout").onclick = () => zoom(1 / 1.2);
  $("reset").onclick = () => { Object.assign(view, DEFAULT); dirty = true; };
  const spin = $("spin");
  const syncSpin = () => {
    spin.disabled = reduceMotion.matches;
    if (reduceMotion.matches) { spinning = false; spin.title = "Disabled because your system asks for reduced motion"; }
    spin.setAttribute("aria-pressed", String(spinning));
  };
  spin.onclick = () => { spinning = !spinning; syncSpin(); };
  reduceMotion.addEventListener("change", syncSpin); syncSpin();
  dark.addEventListener("change", () => { build(window.__data); });

  function frame() {
    if (spinning && !drag) { view.yaw += 0.006; dirty = true; }
    if (dirty) draw();
    requestAnimationFrame(frame);
  }

  addEventListener("resize", size);
  size();
  requestAnimationFrame(frame);

  fetch("activity.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => { window.__data = data; build(data); })
    .catch(() => {
      $("state").innerHTML = 'Could not load the contribution data. <a href="https://github.com/rigelra15">See the profile on GitHub</a>.';
    });
})();
</script>
</body>
</html>
